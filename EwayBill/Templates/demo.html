<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generate PDF</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/2.4.0/purify.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.4.0/jspdf.umd.min.js"></script>
    <style>
        #pdfContent {
            font-family: Arial, sans-serif;
            font-size: 14px; /* Set normal text size */
            line-height: 1.6;
            color: #333;
        }

        h1 {
            font-size: 18px; /* Slightly larger size for the title */
            color: #0056b3;
        }

        ul {
            padding-left: 20px;
        }

            ul li {
                margin-bottom: 5px;
            }
    </style>
</head>
<body>
    <button onclick="generatePdf()">Download PDF</button>

    <div id="pdfContent">
        <h1>User Registration Details</h1>
        <p><strong>Name:</strong> John Doe</p>
        <p><strong>Email:</strong> john.doe@example.com</p>
        <p><strong>Phone:</strong> 123-456-7890</p>
        <p><strong>Address:</strong> 1234 Elm Street, Springfield</p>
        <p><strong>Hobbies:</strong> Reading, Writing</p>
        <p><strong>Uploaded Files:</strong></p>
        <ul>
            <li>file1.jpg</li>
            <li>file2.pdf</li>
        </ul>
    </div>

    <script>
        async function generatePdf() {
        const { jsPDF } = window.jspdf;

        // Create a new jsPDF instance
        const pdf = new jsPDF();

        // Select the content
        const content = document.getElementById("pdfContent");

        // Use jsPDF's html method to generate the PDF
        await pdf.html(content, {
        callback: function (doc) {
        // Save the generated PDF
        doc.save("UserDetails.pdf");
        },
        x: 10,
        y: 10,
        html2canvas: {
        scale: 0.8, // Adjust scaling to fit content
        },
        });
        }
    </script>
</body>
</html>
